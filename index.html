<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>LUM Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
  <script src="//libtl.com/sdk.js" data-zone="12007112" data-sdk="show_12007112"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#05070a; color:#f4f7fb; }
    .app { max-width:430px; margin:0 auto; padding:14px 14px 100px; }
    button { width:100%; padding:14px; margin:8px 0; background:#2fce4a; color:#06210c; border:0; border-radius:12px; font-weight:800; }
    .nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:#0a100c; }
    .nav button { background:transparent; color:#9aa6b5; }
    .nav button.on { color:#2fce4a; }
  </style>
</head>
<body>
  <div class="app">
    <h1>LUM Miner</h1>
    <div id="held">0.00000000 LUM</div>
    <div id="reward">+0.00000000</div>
    <button id="claim">Claim</button>
    <button id="ad">Watch ad to boost</button>
    <p>Balance and clicks should work. Go to Tasks / Friends / Profile with the bottom buttons.</p>
  </div>
  <nav class="nav">
    <button class="on" data-page="home">Mine</button>
    <button data-page="tasks">Tasks</button>
    <button data-page="boost">Boost</button>
    <button data-page="friends">Friends</button>
    <button data-page="profile">Profile</button>
  </nav>
  <script>
    const KEY = "lum-miner-v3";
    let claimed = 0, bonus = 0, startedAt = Date.now();
    const $ = id => document.getElementById(id);

    function load() {
      try {
        const s = JSON.parse(localStorage.getItem(KEY) || "{}");
        claimed = s.claimed || 0;
        bonus = s.bonus || 0;
        startedAt = s.startedAt || Date.now();
      } catch (e) {}
    }
    function save() {
      localStorage.setItem(KEY, JSON.stringify({ claimed, bonus, startedAt }));
    }
    function purse() { return claimed + bonus; }
    function paint() {
      $("held").textContent = purse().toFixed(8) + " LUM";
    }

    load();
    paint();
    setInterval(paint, 1000);

    $("claim").onclick = () => {
      claimed += 1;
      startedAt = Date.now();
      save();
      paint();
    };
    $("ad").onclick = () => {
      bonus += 10;
      save();
      paint();
    };

    document.querySelectorAll(".nav button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".nav button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        alert("Page: " + btn.dataset.page);
      };
    });

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
